<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-labelledby="title desc">
  <title id="title">CLI theme for BetterCodex</title>
  <desc id="desc">A dark terminal-inspired Codex window with phosphor green text, cyan accents, squared controls, and a glowing command composer.</desc>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#09100b"/>
      <stop offset="1" stop-color="#040705"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#79f69d" stroke-opacity=".035"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H640" stroke="#79f69d" stroke-opacity=".045"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="280" rx="12" fill="url(#screen)"/>
  <rect width="640" height="280" rx="12" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="639" height="279" rx="11.5" fill="none" stroke="#315d3c"/>

  <g font-family="Cascadia Code,Consolas,monospace">
    <rect x="1" y="1" width="638" height="25" rx="11" fill="#070b08"/>
    <path d="M1 25.5h638" stroke="#24452e"/>
    <circle cx="16" cy="13" r="3" fill="#ff6f7d"/>
    <circle cx="28" cy="13" r="3" fill="#ffc766"/>
    <circle cx="40" cy="13" r="3" fill="#79f69d"/>
    <text x="55" y="17" fill="#7d9f86" font-size="8.5">CODEX // BETTERCODEX // CLI</text>
    <text x="625" y="17" text-anchor="end" fill="#56d977" font-size="8">ONLINE</text>

    <rect x="1" y="26" width="151" height="253" fill="#09100b"/>
    <path d="M152 26v253" stroke="#24452e"/>
    <text x="15" y="50" fill="#79f69d" font-size="9" font-weight="700">~/CODEX</text>
    <text x="15" y="73" fill="#c2ffd1" font-size="8.5">+ NEW TASK</text>
    <text x="15" y="100" fill="#597263" font-size="7.5">// PROJECT</text>
    <text x="15" y="120" fill="#c2ffd1" font-size="8">▾ BETTERCODEX</text>
    <rect x="7" y="130" width="137" height="28" fill="#122219" stroke="#315d3c"/>
    <rect x="7" y="130" width="2" height="28" fill="#79f69d" filter="url(#glow)"/>
    <text x="16" y="148" fill="#c2ffd1" font-size="8">› Build CLI theme</text>
    <text x="16" y="177" fill="#7d9f86" font-size="8">  Polish command UI</text>
    <text x="16" y="196" fill="#7d9f86" font-size="8">  Ship v0.1.0</text>
    <text x="15" y="258" fill="#63dcff" font-size="7.5">λ alexa@bettercodex</text>

    <g transform="translate(176 47)">
      <text x="0" y="0" fill="#56d977" font-size="8">ASSISTANT@CODEX</text>
      <text x="0" y="20" fill="#c2ffd1" font-size="10">CLI theme is wired up.</text>
      <text x="0" y="42" fill="#7d9f86" font-size="8">The app now speaks fluent terminal:</text>
      <text x="0" y="62" fill="#79f69d" font-size="8">  ✓ phosphor palette</text>
      <text x="0" y="78" fill="#79f69d" font-size="8">  ✓ monospace interface</text>
      <text x="0" y="94" fill="#79f69d" font-size="8">  ✓ reversible lifecycle</text>

      <rect x="0" y="111" width="430" height="51" fill="#020403" stroke="#24452e"/>
      <rect x="0" y="111" width="3" height="51" fill="#79f69d"/>
      <text x="14" y="130" fill="#7d9f86" font-size="7.5">$ bettercodex theme enable cli</text>
      <text x="14" y="149" fill="#63dcff" font-size="7.5">theme:cli</text>
      <text x="70" y="149" fill="#c2ffd1" font-size="7.5">ready in 12ms</text>

      <rect x="0" y="181" width="430" height="37" fill="#0d1710" stroke="#56d977"/>
      <rect x="0" y="181" width="3" height="37" fill="#79f69d" filter="url(#glow)"/>
      <text x="15" y="204" fill="#79f69d" font-size="9">$</text>
      <text x="31" y="204" fill="#c2ffd1" font-size="8.5">Ask Codex anything</text>
      <rect x="401" y="190" width="20" height="19" fill="#173321" stroke="#56d977"/>
      <text x="411" y="203" text-anchor="middle" fill="#79f69d" font-size="9">↵</text>
    </g>
  </g>
  <rect width="640" height="280" rx="12" fill="url(#scan)" pointer-events="none"/>
</svg>
