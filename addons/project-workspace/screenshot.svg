      </g>
      <text x="0" y="108" fill="#77777d" font-size="8" font-weight="650">PROJECTS</text>
      <text x="0" y="130" fill="#d0d0d2" font-size="9.5">▱ bettercodex</text>
      <text x="16" y="150" fill="#b7b7bc" font-size="8.5">Build workspace</text>
