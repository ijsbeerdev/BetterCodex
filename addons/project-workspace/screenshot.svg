<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">Workspace documentation inside Codex</title>
  <desc id="desc">The Codex sidebar sits beside a native project page tree and a clean architecture document with headings, file references, code, and Codex context controls.</desc>
  <rect width="640" height="320" rx="18" fill="#111112"/>
  <rect width="142" height="320" rx="18" fill="#1b1b1d"/>
  <path d="M142 0v320" stroke="#303034"/>
  <g font-family="Segoe UI,Arial,sans-serif">
