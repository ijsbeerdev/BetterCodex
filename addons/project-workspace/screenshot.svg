      <circle cx="24" cy="65" r="3.6" fill="none" stroke="#96969b" stroke-width="1"/>
      <path d="m27 68 3 3" stroke="#96969b" stroke-width="1"/>
      <text x="35" y="69" fill="#99999e" font-size="8.5">Search pages</text>
      <text x="16" y="101" fill="#737379" font-size="7.5" font-weight="650">FAVORITES</text>
      <text x="17" y="121" fill="#d4d4d7" font-size="8.5">★  Project Overview</text>
      <text x="16" y="149" fill="#737379" font-size="7.5" font-weight="650">PAGES</text>
      <text x="17" y="169" fill="#dadadd" font-size="8.5">▾  📁  Project</text>
      <rect x="12" y="178" width="130" height="24" rx="7" fill="#2b2b2e"/>
      <text x="34" y="194" fill="#f3f3f4" font-size="8.5">📄  Architecture</text>
      <text x="34" y="217" fill="#bebec2" font-size="8.5">☑  TODO</text>
      <text x="34" y="240" fill="#bebec2" font-size="8.5">▾  📚  Documentation</text>
