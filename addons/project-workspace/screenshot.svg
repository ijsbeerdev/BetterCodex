      <circle cx="7" cy="285" r="7" fill="#25374a"/>
      <text x="18" y="288" fill="#eeeeef" font-size="8.5">bettercodex</text>
    </g>

    <g transform="translate(142 0)">
      <rect width="154" height="320" fill="#171718"/>
      <path d="M154 0v320" stroke="#303034"/>
