        <text x="12" y="201" fill="#77777e" font-size="7">JAVASCRIPT</text>
        <text x="12" y="220" fill="#c792ea" font-size="8">BetterCodex</text><text x="61" y="220" fill="#d7d7da" font-size="8">.register({</text>
        <text x="22" y="235" fill="#82aaff" font-size="8">start</text><text x="47" y="235" fill="#d7d7da" font-size="8">() { mountWorkspace(); },</text>
        <text x="22" y="250" fill="#82aaff" font-size="8">stop</text><text x="44" y="250" fill="#d7d7da" font-size="8">() { cleanup(); }</text>
        <text x="0" y="286" fill="#76767c" font-size="8.5">Type '/' for commands…</text>
      </g>
