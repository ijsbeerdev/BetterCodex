        <text x="0" y="80" fill="#c4c4c8" font-size="9.5">BetterCodex patches the official Codex renderer at runtime.</text>
        <text x="0" y="111" fill="#eeeeef" font-size="13" font-weight="650">Frontend</text>
        <rect x="0" y="124" width="126" height="22" rx="5" fill="#222225"/>
