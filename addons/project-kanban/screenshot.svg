        </g>
        <g transform="translate(251)">
          <rect width="104" height="78" rx="9" fill="#202022"/>
          <text x="10" y="18" fill="#f0f0f1" font-size="8.5" font-weight="600">Review access</text><text x="10" y="30" fill="#f0f0f1" font-size="8.5" font-weight="600">policy</text>
          <text x="10" y="50" fill="#85858b" font-size="7.5">bettercodex</text><text x="93" y="50" text-anchor="end" fill="#85858b" font-size="7.5">2m</text>
          <text x="10" y="68" fill="#85858b" font-size="7.5">3 files</text><text x="45" y="68" fill="#4bc982" font-size="7.5">+86</text><text x="72" y="68" fill="#e05262" font-size="7.5">−12</text>
        </g>
        <g transform="translate(370)">
          <rect width="104" height="62" rx="9" fill="#202022"/>
