      <rect x="82" y="177" width="42" height="13" rx="6.5" fill="#224834"/>
      <text x="103" y="186.5" text-anchor="middle" fill="#70dda6" font-size="6.5">Waiting</text>
      <text x="16" y="208" fill="#b7b7bc" font-size="8.5">Update README</text>
      <circle cx="7" cy="285" r="7" fill="#25374a"/>
      <text x="18" y="288" fill="#eeeeef" font-size="8.5">bettercodex</text>
