<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">Kanban activity board inside Codex</title>
  <desc id="desc">The Codex sidebar remains visible beside compact Old, In Progress, Waiting, and Done task lanes with live activity and code-change totals.</desc>
  <rect width="640" height="320" rx="18" fill="#111112"/>
  <rect width="146" height="320" rx="18" fill="#1b1b1d"/>
  <path d="M146 0v320" stroke="#303034"/>
  <g font-family="Segoe UI,Arial,sans-serif">
